<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>SRC SmartBot — Your Smart Campus Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="logo">
        <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V5M9 14h.01M15 14h.01"/><circle cx="12" cy="3.8" r="1"/></svg>
      </div>
      <div class="brand-text">
        <h1>SRC SmartBot</h1>
        <p>Your Smart Campus Assistant</p>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn" type="button">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>

    <nav class="nav" id="nav">
      <button class="nav-item active" type="button" data-section="home">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home
      </button>
      <button class="nav-item" type="button" data-section="info" data-query="Tell me about SRC, Srinivasa Ramanujan Centre.">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>SRC Information
      </button>
      <button class="nav-item" type="button" data-section="departments" data-query="What departments and programmes are available at SRC?">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Departments
      </button>
      <button class="nav-item" type="button" data-section="admissions" data-query="Tell me about admissions at SRC.">
        <svg class="ico" viewBox="0 0 24 24"><path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg>Admissions
      </button>
      <button class="nav-item" type="button" data-section="hostel" data-query="Tell me about the hostel facilities at SRC.">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 20V8l9-5 9 5v12M9 20v-6h6v6"/></svg>Hostel
      </button>
      <button class="nav-item" type="button" data-section="library" data-query="Tell me about the library at SRC.">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v15h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4z"/><path d="M12 5v15"/></svg>Library
      </button>
      <button class="nav-item" type="button" data-section="transport" data-query="What transport facilities are available at SRC?">
        <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4M8 14h.01M16 14h.01"/></svg>Transport
      </button>
      <button class="nav-item" type="button" data-section="events" data-query="What events and activities are held at SRC?">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Events
      </button>
      <button class="nav-item" type="button" data-section="facilities" data-query="What facilities are available at SRC?">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Campus Facilities
      </button>
    </nav>

    <div class="sidebar-foot">
      <button class="nav-item" type="button" id="settingsBtn" data-section="settings">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings
      </button>
      <p class="campus">Srinivasa Ramanujan Centre<br>SASTRA Deemed University, Kumbakonam</p>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="top-title">
        <h2>SRC AI Assistant</h2>
        <span class="status" id="status"><i></i><b id="statusText">Ready</b></span>
      </div>
      <label class="lang" for="languageSelect">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        <select id="languageSelect" aria-label="Language">
          <option value="Auto">Auto</option>
          <option value="English">English</option>
          <option value="Tamil">Tamil</option>
          <option value="Telugu">Telugu</option>
          <option value="Tanglish">Tanglish</option>
        </select>
      </label>
    </header>

    <section class="chat" id="chatArea" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="orb"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V5M9 14h.01M15 14h.01"/><circle cx="12" cy="3.8" r="1"/></svg></div>
        <h2>How can I help you with SRC?</h2>
        <p>Your smart companion for campus information.</p>
        <div class="cards">
          <button class="card" type="button" data-query="What is SRC?"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg><span>What is SRC?</span></button>
          <button class="card" type="button" data-query="What programmes are offered?"><svg class="ico" viewBox="0 0 24 24"><path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg><span>What programmes are offered?</span></button>
          <button class="card" type="button" data-query="Tell me about admissions."><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>Tell me about admissions.</span></button>
          <button class="card" type="button" data-query="What facilities are available at SRC?"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>What facilities are available at SRC?</span></button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="msg bot typing" id="typing" hidden>
        <div class="avatar"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V5M9 14h.01M15 14h.01"/></svg></div>
        <div class="bubble"><span></span><span></span><span></span></div>
      </div>
    </section>

    <footer class="composer">
      <form class="input-wrap" id="chatForm" autocomplete="off">
        <textarea id="userInput" rows="1" maxlength="2000" placeholder="Ask anything about SRC…" aria-label="Message"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="Send message" disabled>
          <svg class="ico" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </form>
      <p class="hint">Enter to send · Shift+Enter for a new line</p>
    </footer>
  </main>
</div>

<!-- ============ SETTINGS ============ -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle">Settings</h3>
    <label for="backendUrl">Backend chat URL</label>
    <input type="url" id="backendUrl" placeholder="http://127.0.0.1:5000/chat">
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="clearChatBtn">Clear conversation</button>
      <button type="button" class="btn ghost" id="resetUrlBtn">Reset URL</button>
      <button type="button" class="btn primary" id="saveSettingsBtn">Save</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
